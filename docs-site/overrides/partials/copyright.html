{#- Material's footer copyright plus a link to the privacy policy on every page. -#}
<div class="md-copyright">
  {% if config.copyright %}

      {{ config.copyright }}<br>
      <a href="{{ 'pomoc/prywatnosc/' | url }}">Polityka prywatności</a> ·
      <a href="https://suppi.pl/mellis" target="_blank" rel="noopener">Wesprzyj projekt</a>

      Material for MkDocs
    </a>
  {% endif %}
</div>

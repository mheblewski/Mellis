# Dependency updates as pull requests, reviewed like any change: nothing on a server updates by itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      dev-dependencies:
        dependency-type: development

  # The image's base (Dockerfile) and the pinned compose images (deploy/docker-compose.yml: pgvector, Caddy,
  # cloudflared). Keep pgvector on pg17: another Postgres major needs a dump/restore.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pgvector/pgvector
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

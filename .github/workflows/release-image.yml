name: Release image

# A tag vX.Y.Z (equal to package.json "version") publishes ghcr.io/<owner>/mellis:X.Y.Z, :X.Y and :latest for amd64
# and arm64. Servers install a pinned X.Y.Z; :latest only tells the update check what is newest.
# A branch push that changes the image (or this workflow), or a run by hand, builds both platforms without publishing:
# a check before tagging.

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "**"
    # Not evaluated for tag pushes: every release tag builds.
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - deploy/docker-compose.yml
      - deploy/Caddyfile
      - scripts/install-server.sh
      - knowledge/**
      - .github/workflows/release-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Keyless cosign signature of the published image (GitHub OIDC → Sigstore); no signing key to keep.
  id-token: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})." >&2
            exit 1
          fi
          # One version for the image, the installer's pinned release and the app (apps/ios/Version.xcconfig).
          scripts/sync-version.sh --check
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/mellis" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,enable=${{ github.ref_type != 'tag' }}

      - name: Build (and publish on a tag)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MELLIS_VERSION=${{ steps.version.outputs.version }}
            MELLIS_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.ref_type == 'tag'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        # Verify: cosign verify ghcr.io/<owner>/mellis:X.Y.Z \
        #   --certificate-identity-regexp 'https://github.com/<owner>/Mellis/.github/workflows/release-image.yml@refs/tags/v.*' \
        #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Smoke test (amd64)
        # The published image must start and report its version without a database: migrate.js and main.js need one,
        # so check the compiled config module and the environment baked into the image instead.
        run: |
          docker buildx build --load --target runtime --platform linux/amd64 \
            --build-arg MELLIS_VERSION=${{ steps.version.outputs.version }} \
            --build-arg MELLIS_REVISION=${{ github.sha }} \
            --cache-from type=gha -t mellis-smoke .
          docker run --rm mellis-smoke node -e '
            const { buildAppConfig } = require("./dist/modules/app-config/application/app-config.js");
            const server = buildAppConfig().server;
            console.log(JSON.stringify(server));
            if (server.version !== process.env.MELLIS_VERSION || !server.revision) process.exit(1);
          '
          docker run --rm mellis-smoke ls infra/db/migrations | tail -1

name: Docs

# The user documentation (docs-site/, MkDocs Material) on GitHub Pages. Every push to main that changes it publishes
# the site; a pull request only builds it (strict: broken links and missing pages fail the build).
# Pages must be enabled once: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - docs-site/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs-site/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - run: pip install -r docs-site/requirements.txt
      - run: mkdocs build --strict -f docs-site/mkdocs.yml -d ../site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
